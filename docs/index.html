
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crypto Futures Screener</title>
  <style>
    body {
      margin: 0;
      padding: 18px;
      background: #0b1020;
      color: #e8efff;
      font-family: Arial, sans-serif;
    }

    h1 { color: #42e8c5; }

    #status {
      color: #aab8d5;
      margin: 12px 0;
    }

    .table-wrap {
      overflow-x: auto;
      background: #121a2e;
      border: 1px solid #293653;
      border-radius: 10px;
    }

    table {
      width: 100%;
      min-width: 750px;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #293653;
      white-space: nowrap;
    }

    th {
      color: #42e8c5;
      background: #17223a;
    }

    .note {
      color: #9aa9c7;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>Crypto Futures Screener</h1>
  <p class="note">CoinDCX Futures · Scanner Results</p>

  <div id="status">Loading scanner results...</div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Coin</th>
          <th>Price</th>
          <th>Signal</th>
          <th>RSI</th>
          <th>ADX</th>
          <th>MACD</th>
          <th>EMA Trend</th>
          <th>Updated</th>
        </tr>
      </thead>
      <tbody id="signals-body"></tbody>
    </table>
  </div>

  <p class="note">
    Signals are technical indicators, not guaranteed predictions.
  </p>

  <script src="js/indicators.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
